global:
  resolve_timeout: 1m
  smtp_require_tls: true

# Email delivery uses Mailtrap sandbox (https://mailtrap.io) so notifications
# land in a test inbox instead of a real mail server. Replace the placeholder
# auth_password with the Mailtrap inbox password before starting the stack.
# NEVER commit real credentials.

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1m
  receiver: 'warning-email'
  routes:
    - match:
        severity: critical
      receiver: 'critical-email'
      repeat_interval: 5m
    - match:
        severity: warning
      receiver: 'warning-email'
      repeat_interval: 5m

receivers:
  - name: 'critical-email'
    email_configs:
      - to: 'alex.aelenei04@gmail.com'
        from: 'alerts@safetransfer.local'
        smarthost: sandbox.smtp.mailtrap.io:587
        auth_username: 'REPLACE_WITH_MAILTRAP_USERNAME'
        auth_password: 'REPLACE_WITH_MAILTRAP_PASSWORD'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'

  - name: 'warning-email'
    email_configs:
      - to: 'alex.aelenei04@gmail.com'
        from: 'alerts@safetransfer.local'
        smarthost: sandbox.smtp.mailtrap.io:587
        auth_username: 'REPLACE_WITH_MAILTRAP_USERNAME'
        auth_password: 'REPLACE_WITH_MAILTRAP_PASSWORD'
        send_resolved: true
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }}'

# Suppress WARNING when a CRITICAL with the same alert_group is already firing.
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alert_group']
